name: CD

# Builds and pushes apps/api and apps/web production images to GHCR, but only
# for a commit that has already passed CI on `main` — this workflow runs
# `workflow_run`-triggered off CI's completion instead of its own push
# trigger, so it never builds a commit whose tests haven't been verified, and
# never re-runs the test suite a second time.
#
# docs/04 - Engineering_Playbook.md §14 step 4 ("on merge to main: build and
# push web and api images") — this is that step.

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            dockerfile: apps/api/Dockerfile
            image: ohmypos-api
          - app: web
            dockerfile: apps/web/Dockerfile
            image: ohmypos-web
    steps:
      - name: Checkout the commit CI just verified
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=sha,prefix=,value=${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
